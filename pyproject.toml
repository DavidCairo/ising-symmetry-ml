[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ising-ml"
version = "0.1.0"
description = "Learning phases and Z2 symmetry breaking in the 2D Ising model with neural networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Cairo" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/ising_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
